# Publish to PyPI when a version tag (v0.1.1, ...) is pushed. Uses PyPI trusted publishing:
# no token is stored anywhere. PyPI must list this repository, this workflow file and the
# "pypi" environment as a trusted publisher of beatfit.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv run --python ${{ matrix.python }} pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          meta=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/beatfit/__init__.py)
          echo "tag $tag, pyproject.toml $meta, __init__.py $code"
          [ "$tag" = "$meta" ] && [ "$tag" = "$code" ]
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/beatfit/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv publish --trusted-publishing always
